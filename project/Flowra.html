const LangCtx = React.createContext({ lang: 'en', setLang: () => {}, T: TRANSLATIONS.en });

function LangProvider({ children }) {
  const [lang, setLang] = React.useState(() => {
    try { return localStorage.getItem('flowra-lang') || 'en'; } catch { return 'en'; }
  });
  React.useEffect(() => {
    try { localStorage.setItem('flowra-lang', lang); } catch {}
  }, [lang]);
  const T = TRANSLATIONS[lang] || TRANSLATIONS.en;
  return <LangCtx.Provider value={{ lang, setLang, T }}>{children}</LangCtx.Provider>;
}

function LanguageToggle() {
  const { lang, setLang } = React.useContext(LangCtx);
  return (
    <div style={{ display: 'flex', alignItems: 'center', borderRadius: 999, border: `1px solid ${P.line}`, overflow: 'hidden', flexShrink: 0 }}>
      {['EN', 'IT'].map(l => (
        <button key={l} onClick={() => setLang(l.toLowerCase())}
          style={{
            padding: '4px 10px', fontSize: 11, fontWeight: 600, cursor: 'pointer', border: 'none',
            background: lang === l.toLowerCase() ? P.ink : 'transparent',
            color: lang === l.toLowerCase() ? 'white' : P.muted,
            letterSpacing: '0.06em', transition: 'background 0.15s, color 0.15s',
            fontFamily: 'Manrope, sans-serif',
          }}>
          {l}
        </button>
      ))}
    </div>
  );
}

/* ---- Custom SVG Charts ---- */
function polyPoints(data, xKey, yKey, w, h, minY, maxY) {
  return data.map((d, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((d[yKey] - minY) / (maxY - minY)) * h;
    return `${x},${y}`;
  }).join(' ');
}

function areaPath(data, xKey, yKey, w, h, minY, maxY) {
  const pts = data.map((d, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((d[yKey] - minY) / (maxY - minY)) * h;
    return `${x},${y}`;
  });
  return `M${pts[0]} ` + pts.slice(1).map(p => `L${p}`).join(' ') + ` L${w},${h} L0,${h} Z`;
}

function linePath(data, xKey, yKey, w, h, minY, maxY) {
  return data.map((d, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((d[yKey] - minY) / (maxY - minY)) * h;
    return (i === 0 ? 'M' : 'L') + `${x},${y}`;
  }).join(' ');
}

function ForecastChart({ data, approvedIds = [] }) {
  const [tooltip, setTooltip] = useState(null);
  const w = 700, h = 200, padL = 52, padB = 24, padT = 10, padR = 10;
  const cw = w - padL - padR, ch = h - padT - padB;
  const minY = -12000, maxY = 60000;
  const toY = v => padT + ch - ((v - minY) / (maxY - minY)) * ch;
  const toX = day => padL + (day / 90) * cw;

  const zeroY = toY(0);
  const safeLoY = toY(15000);
  const safeHiY = toY(50000);

  const yTicks = [-10000, 0, 15000, 30000, 45000, 60000];
  const xTicks = [0, 15, 30, 45, 60, 75, 90];

  // Baseline path
  const basePts = data.map(d => ({ x: toX(d.day), y: toY(d.baseline), v: d.baseline }));
  const baseLinePath = basePts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(' ');

  // Area below zero (red danger zone fill along baseline)
  const redAreaPts = [...basePts];
  let redArea = '';
  let seg = [];
  for (let i = 0; i < redAreaPts.length; i++) {
    const p = redAreaPts[i];
    if (p.v < 0) {
      seg.push(p);
    } else {
      if (seg.length) {
        // close segment
        const first = seg[0], last = seg[seg.length - 1];
        redArea += `M${first.x},${Math.min(first.y, zeroY)} ` + seg.map(s => `L${s.x},${s.y}`).join(' ') + ` L${last.x},${zeroY} Z `;
        seg = [];
      }
    }
  }
  if (seg.length) {
    const first = seg[0], last = seg[seg.length - 1];
    redArea += `M${first.x},${Math.min(first.y, zeroY)} ` + seg.map(s => `L${s.x},${s.y}`).join(' ') + ` L${last.x},${zeroY} Z`;
  }

  // Planned lines — one per approved action (incremental)
  const actionOrder = ['early-pay-capri', 'delay-ombrelloni', 'vat-rateation'];
  const approvedInOrder = actionOrder.filter(id => approvedIds.includes(id));

  const plannedLines = approvedInOrder.map((_, idx) => {
    const ids = approvedInOrder.slice(0, idx + 1);
    const pts = data.map(d => {
      const lift = ids.reduce((sum, id) => {
        const a = ACTION_LIFTS[id];
        return a && d.day >= a.fromDay ? sum + a.amount : sum;
      }, 0);
      return { x: toX(d.day), y: toY(d.baseline + lift) };
    });
    return pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(' ');
  });

  const handleMouseMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const mx = e.clientX - rect.left - padL;
    const dayF = (mx / cw) * 90;
    const idx = Math.max(0, Math.min(data.length - 1, Math.round(dayF)));
    const d = data[idx];
    if (d) {
      const lift = approvedIds.reduce((sum, id) => {
        const a = ACTION_LIFTS[id];
        return a && d.day >= a.fromDay ? sum + a.amount : sum;
      }, 0);
      setTooltip({ x: toX(d.day), d, planned: d.baseline + lift });
    }
  };

  const lineColors = [P.forest, '#2F8A64', '#4AAA80'];
  const keyDays = [9, 14, 33];
  const keyColors = [P.amber, P.terra, P.forest];

  return (
    <div style={{ position: 'relative', width: '100%' }}>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{ display: 'block' }}
        onMouseMove={handleMouseMove} onMouseLeave={() => setTooltip(null)}>
        <defs>
          <linearGradient id="pFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={P.leaf} stopOpacity="0.2" />
            <stop offset="100%" stopColor={P.leaf} stopOpacity="0" />
          </linearGradient>
          <clipPath id="chartClip">
            <rect x={padL} y={padT} width={cw} height={ch} />
          </clipPath>
        </defs>

        {/* Safe zone band */}
        <rect x={padL} y={safeHiY} width={cw} height={safeLoY - safeHiY} fill={P.mist} fillOpacity="0.3" clipPath="url(#chartClip)" />

        {/* Below-zero danger fill */}
        <rect x={padL} y={zeroY} width={cw} height={padT + ch - zeroY} fill={P.terra} fillOpacity="0.08" clipPath="url(#chartClip)" />

        {/* Zero line — prominent */}
        <line x1={padL} x2={padL + cw} y1={zeroY} y2={zeroY} stroke={P.terra} strokeWidth="1" strokeOpacity="0.6" />
        <text x={padL - 6} y={zeroY + 4} textAnchor="end" fill={P.terra} fontSize="10" fontFamily="JetBrains Mono" opacity="0.8">€0</text>

        {/* Grid lines */}
        {yTicks.filter(v => v !== 0).map(v => {
          const y = toY(v);
          return <line key={v} x1={padL} x2={padL + cw} y1={y} y2={y} stroke={P.lineSoft} strokeDasharray="2 4" />;
        })}

        {/* Event lines */}
        {keyDays.map((day, i) => (
          <line key={day} x1={toX(day)} x2={toX(day)} y1={padT} y2={padT + ch}
            stroke={keyColors[i]} strokeDasharray="2 4" strokeOpacity="0.3" clipPath="url(#chartClip)" />
        ))}

        {/* Red fill area where baseline < 0 */}
        {redArea && <path d={redArea} fill={P.terra} fillOpacity="0.18" clipPath="url(#chartClip)" />}

        {/* Baseline — changes color below zero */}
        <path d={baseLinePath} fill="none" stroke={P.muted} strokeWidth="1.5" strokeDasharray="4 3" clipPath="url(#chartClip)" />

        {/* Planned lines — newest gets draw-on animation */}
        {plannedLines.map((path, i) => {
          const isNewest = i === plannedLines.length - 1;
          // Build fill path for newest line
          const fillPath = isNewest ? path + ` L${toX(90)},${toY(0)} L${toX(0)},${toY(0)} Z` : null;
          const lineColor = lineColors[Math.min(i, lineColors.length - 1)];
          return (
            <g key={`line-${approvedIds.join('-')}-${i}`}>
              {/* Fill area under newest line */}
              {isNewest && (
                <path
                  d={fillPath}
                  fill={lineColor}
                  fillOpacity="0.08"
                  className="chart-fill-enter"
                  clipPath="url(#chartClip)"
                />
              )}
              {/* Line itself */}
              <path
                d={path}
                fill="none"
                stroke={lineColor}
                strokeWidth={isNewest ? 2.5 : 1.5}
                strokeOpacity={isNewest ? 1 : 0.28}
                style={{ transition: 'stroke-opacity 0.6s ease' }}
                strokeDasharray={isNewest ? 3000 : 'none'}
                className={isNewest ? 'chart-line-enter' : ''}
                clipPath="url(#chartClip)"
              />
              {/* Animated dot at end of newest line */}
              {isNewest && (() => {
                const lift = approvedIds.reduce((sum, id) => {
                  const a = ACTION_LIFTS[id];
                  return a && 90 >= a.fromDay ? sum + a.amount : sum;
                }, 0);
                const endPt = { x: toX(90), y: toY(BASE_FORECAST[BASE_FORECAST.length-1].baseline + lift) };
                return (
                  <>
                  <circle
                    cx={endPt.x} cy={endPt.y} r="5"
                    fill={lineColor}
                    className="chart-dot-enter"
                    style={{ transformOrigin: `${endPt.x}px ${endPt.y}px` }}
                    clipPath="url(#chartClip)"
                  />
                  <circle
                    cx={endPt.x} cy={endPt.y} r="5"
                    fill="none" stroke={lineColor} strokeWidth="2"
                    className="chart-dot-ring"
                    style={{ transformOrigin: `${endPt.x}px ${endPt.y}px` }}
                    clipPath="url(#chartClip)"
                  />
                  </>
                );
              })()}
            </g>
          );
        })}

        {/* Tooltip line */}
        {tooltip && <line x1={tooltip.x} x2={tooltip.x} y1={padT} y2={padT + ch} stroke={P.line} strokeWidth="1" />}

        {/* Y axis labels */}
        {yTicks.filter(v => v !== 0).map(v => {
          const y = toY(v);
          const label = v < 0 ? `-€${Math.abs(v)/1000}k` : `€${v/1000}k`;
          return <text key={v} x={padL - 6} y={y + 4} textAnchor="end" fill={v < 0 ? P.terra : P.muted} fontSize="10" fontFamily="JetBrains Mono" opacity={v < 0 ? 0.8 : 1}>{label}</text>;
        })}

        {/* X axis labels */}
        {xTicks.map(v => (
          <text key={v} x={toX(v)} y={h - 4} textAnchor="middle" fill={P.muted} fontSize="10" fontFamily="JetBrains Mono">
            {v === 0 ? 'today' : `${v}d`}
          </text>
        ))}
        <line x1={padL} x2={padL + cw} y1={padT + ch} y2={padT + ch} stroke={P.line} />
      </svg>

      {/* Tooltip popup */}
      {tooltip && (() => {
        const d = tooltip.d;
        const left = Math.min(tooltip.x + 10, w - 140);
        return (
          <div style={{ position: 'absolute', top: 20, left: `${(left / w) * 100}%`, background: P.ink, color: 'white', borderRadius: 8, padding: '8px 12px', fontSize: 11, pointerEvents: 'none', zIndex: 10, whiteSpace: 'nowrap' }}>
            <div style={{ textTransform: 'uppercase', letterSpacing: '0.1em', opacity: 0.5, marginBottom: 4 }}>Day {d.day}</div>
            {approvedIds.length > 0 && <div style={{ fontFamily: 'JetBrains Mono', marginBottom: 2, color: P.leaf }}>With Flowra: €{(tooltip.planned/1000).toFixed(1)}k</div>}
            <div style={{ fontFamily: 'JetBrains Mono', opacity: 0.6 }}>No action: €{(d.baseline/1000).toFixed(1)}k</div>
          </div>
        );
      })()}
    </div>
  );
}

function CreditLineChart({ data }) {
  const w = 400, h = 120, padL = 10, padB = 24, padT = 10, padR = 10;
  const cw = w - padL - padR, ch = h - padT - padB;
  const minY = 50, maxY = 100;
  const pts = data.map((d, i) => ({
    x: padL + (i / (data.length - 1)) * cw,
    y: padT + ch - ((d.score - minY) / (maxY - minY)) * ch,
    d,
  }));
  const linePth = pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(' ');

  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} style={{ display: 'block' }}>
      <path d={linePth} fill="none" stroke={P.forest} strokeWidth="2.5" />
      {pts.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={P.forest} />
      ))}
      {data.map((d, i) => {
        const x = padL + (i / (data.length - 1)) * cw;
        return <text key={i} x={x} y={h - 4} textAnchor="middle" fill={P.muted} fontSize="10" fontFamily="Manrope">{d.month}</text>;
      })}
    </svg>
  );
}

/* ---- Connecting ---- */
function Connecting({ onDone }) {
  const { T } = React.useContext(LangCtx);
  const steps = T.connecting.steps;
  const [done, setDone] = useState(0);
  useEffect(() => {
    if (done < steps.length) {
      const t = setTimeout(() => setDone(done + 1), done === 0 ? 500 : 650);
      return () => clearTimeout(t);
    } else {
      const t = setTimeout(onDone, 1000);
      return () => clearTimeout(t);
    }
  }, [done]);

  return (
    <div className="h-full w-full flex items-center justify-center relative overflow-hidden" style={{ background: P.cream }}>
      <div className="absolute inset-0 grain opacity-[0.3] pointer-events-none" />
      <div className="relative z-10 w-full max-w-xl px-8">
        <div className="flex items-center gap-2 mb-2 text-xs uppercase tracking-widest" style={{ color: P.muted }}>
          <span className="w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: P.leaf }} />
          {T.connecting.badge}
        </div>
        <h2 className="font-display text-4xl mb-10" style={{ color: P.ink, fontWeight: 400 }}>
          {T.connecting.headline} <span style={{ fontStyle: "italic", color: P.forest }}>{T.connecting.headlineItalic}</span>
        </h2>
        <div className="space-y-3">
          {steps.map((s, i) => {
            const isDone = i < done, isActive = i === done;
            return (
              <div key={i} className="flex items-center gap-4 py-3 px-4 rounded-xl relative overflow-hidden"
                style={{ background: isActive ? P.paper : "transparent", border: `1px solid ${isActive ? P.line : "transparent"}`, opacity: isDone || isActive ? 1 : 0.35, transition: "opacity 0.3s, background 0.3s" }}>
                {isActive && <div className="absolute inset-0 scan-line pointer-events-none" />}
                <div className="flex-shrink-0">
                  {isDone ? (
                    <div className="w-6 h-6 rounded-full flex items-center justify-center" style={{ background: P.forest }}>
                      <Check size={13} color="white" strokeWidth={3} />
                    </div>
                  ) : isActive ? (
                    <div className="w-6 h-6 rounded-full border-2 flex items-center justify-center" style={{ borderColor: P.leaf }}>
                      <div className="w-2 h-2 rounded-full pulse-dot" style={{ background: P.leaf }} />
                    </div>
                  ) : (
                    <div className="w-6 h-6 rounded-full border-2" style={{ borderColor: P.line }} />
                  )}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium" style={{ color: P.ink }}>{s.label}</div>
                  {(isDone || isActive) && <div className="text-xs font-mono mt-0.5 fade-in" style={{ color: P.muted }}>{s.detail}</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const BASE_FORECAST = (() => {
  const out = [];
  for (let d = 0; d <= 90; d++) {
    let b;
    // No intervention: payroll day 9, rent day 4, utilities day 7, ombrelloni day 12, VAT day 14
    if (d < 4)       b = 18400 - d * 580;
    else if (d < 5)  b = 16080 - 3400;           // concession rent
    else if (d < 7)  b = 12680 - (d-5) * 520;
    else if (d < 8)  b = 11640 - 1240;           // utilities
    else if (d < 9)  b = 10400 - 520;
    else if (d < 10) b = 9880 - 11800;           // payroll → negative
    else if (d < 12) b = -1920 + (d-10) * 900;  // small daily receipts
    else if (d < 13) b = -120 - 2800;            // ombrelloni payment
    else if (d < 14) b = -2920 - 480;
    else if (d < 15) b = -3400 - 6200;           // VAT → deep negative
    else if (d < 22) b = -9600 + (d-15) * 180;  // very slow recovery
    else if (d < 32) b = -8340 + (d-22) * 820;  // receivables start
    else if (d < 50) b = 260 + (d-32) * 1100;
    else if (d < 70) b = 20060 + (d-50) * 820;
    else b = 36460 + (d-70) * 220;
    out.push({ day: d, baseline: Math.round(b / 100) * 100 });
  }
  return out;
})();

const ACTION_LIFTS = {
  'early-pay-capri':  { fromDay: 8,  amount: 4365 },

  'vat-rateation':    { fromDay: 14, amount: 4650 },

};

function computePlanned(baseData, approvedIds) {
  return baseData.map(d => {
    const lift = approvedIds.reduce((sum, id) => {
      const a = ACTION_LIFTS[id];
      return a && d.day >= a.fromDay ? sum + a.amount : sum;
    }, 0);
    return { ...d, planned: d.baseline + lift };
  });
}

/* ---- Reasoning Block ---- */
function ReasoningBlock({ steps }) {
  const { T } = React.useContext(LangCtx);
  const [visible, setVisible] = useState(0);
  const [done, setDone] = useState(false);
  const [gone, setGone] = useState(false);
  const now = new Date();
  const baseTime = now.getHours() * 60 + now.getMinutes();

  useEffect(() => {
    const timers = steps.map((_, i) => setTimeout(() => setVisible(i + 1), i * 500 + 200));
    const doneT = setTimeout(() => setDone(true), steps.length * 500 + 400);
    const goneT = setTimeout(() => setGone(true), steps.length * 500 + 3500);
    return () => { timers.forEach(clearTimeout); clearTimeout(doneT); clearTimeout(goneT); };
  }, []);

  if (gone) return null;

  const stepTime = (i) => {
    const m = baseTime + i;
    return `${String(Math.floor(m/60) % 24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  };

  return (
    <div style={{
      borderRadius: 8, padding: '8px 12px',
      background: P.lineSoft, border: `1px solid ${P.line}`,
      opacity: done ? 0 : 1,
      maxHeight: done ? 0 : 120,
      overflow: 'hidden',
      transition: 'opacity 0.6s ease 0.6s, max-height 0.5s ease 0.8s',
      marginBottom: 2,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
        {!done && <span style={{ display: 'inline-flex', gap: 3 }}>{[0,1,2].map(j=><span key={j} className="w-1 h-1 rounded-full pulse-dot" style={{ background: P.muted, animationDelay: j*200+'ms', display:'inline-block' }} />)}</span>}
        <span style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.08em', color: P.muted }}>
          {done ? T.thinking.done : T.thinking.active}
        </span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
        {steps.slice(0, visible).map((s, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={{ fontSize: 10, fontFamily: 'JetBrains Mono, monospace', color: P.muted, flexShrink: 0, opacity: 0.7 }}>{stepTime(i)}</span>
            <span style={{ fontSize: 11, color: P.inkSoft, lineHeight: 1.5 }}>{s}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function ChatPanel({ demoPhase, setDemoPhase, capriStatus, setCapriStatus, ombrelloniStatus, setOmbrelloniStatus, vatApplied, factoringState, setFactoringState, triverDone, setTriverDone, onSwitchTab }) {

    setMessages(prev => [...prev, { ...msg, _id: Math.random() }]);
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages.length]);

  // Phase: opening
  useEffect(() => {
    const tc = T.chat.opening;
    const t = [];

    t.push(setTimeout(() => addMsg({ type: 'reasoning', steps: tc.reasoning }), 600));

    t.push(setTimeout(() => addMsg({ type: 'text', text: tc.advice }), 3600));
    t.push(setTimeout(() => setDemoPhase('proposed'), 4200));
    return () => t.forEach(clearTimeout);
  }, []);

  // When VAT is applied by user
  const vatMsgSent = React.useRef(false);
  useEffect(() => {
    if (!vatApplied || vatMsgSent.current) return;
    vatMsgSent.current = true;
    addMsg({ type: 'text', text: T.chat.vatApplied });

  // Phase: replies

    const tc = T.chat.replies;

    t.push(setTimeout(() => setDemoPhase('done'), 3600));

          <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
            <div style={{ width: 22, height: 22, borderRadius: '50%', background: P.mist, border: `1px solid ${P.line}`, flexShrink: 0, marginTop: 2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={P.forest} strokeWidth="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
            <p style={{ fontSize: 13, lineHeight: 1.7, color: P.ink, paddingTop: 2 }}>{highlighted}</p>
          </div>
        );
      }
      case 'status': {
        const iconColor = m.variant === 'danger' ? P.terra : m.variant === 'warn' ? P.amber : P.forest;
        const bgColor   = m.variant === 'danger' ? '#FEF3EF' : m.variant === 'warn' ? '#FDFAED' : '#EEF6F1';
        const borderCol = m.variant === 'danger' ? 'rgba(180,80,50,0.2)' : m.variant === 'warn' ? 'rgba(180,140,30,0.2)' : 'rgba(50,130,90,0.22)';
        return (
          <div style={{ borderRadius: 12, border: `1px solid ${borderCol}`, background: bgColor, padding: '12px 14px' }}>
            {m.label && <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: iconColor, marginBottom: 8 }}>{m.label}</div>}
            {m.number && (
              <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 28, fontWeight: 700, color: iconColor, lineHeight: 1, marginBottom: 6, letterSpacing: '-0.02em' }}>{m.number}</div>
            )}
            <p style={{ fontSize: 13, lineHeight: 1.6, color: P.ink, fontWeight: 500 }}>{m.text}</p>
            {m.sub && <p style={{ fontSize: 12, lineHeight: 1.5, color: P.inkSoft, marginTop: 6, paddingTop: 6, borderTop: `1px solid ${borderCol}` }}>{m.sub}</p>}
          </div>
        );
      }
      case 'user':
        return (
          <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
            <div style={{ maxWidth: '80%', padding: '10px 14px', borderRadius: 14, background: P.lineSoft, fontSize: 14, color: P.ink, lineHeight: 1.5 }}>{m.text}</div>
          </div>
        );
      case 'agent-reply':
        return <p style={{ fontSize: 14, lineHeight: 1.6, color: P.ink }}>{m.text}</p>;
      default: return null;
    }
  };

  return (
    <div className="flex flex-col h-full" style={{ background: P.paper }}>
      <div ref={scrollRef} className="flex-1 overflow-y-auto subtle-scrollbar" style={{ padding: '18px 22px' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {messages.map((m) => (
            <div key={m._id} className="fade-up">{renderMsg(m)}</div>
          ))}
          {isLoading && (
            <div style={{ display: 'flex', gap: 3, padding: '4px 0' }}>
              {[0,1,2].map(j => <span key={j} className="w-1 h-1 rounded-full pulse-dot" style={{ background: P.muted, animationDelay: j*220+'ms', display: 'inline-block' }} />)}
            </div>
          )}
        </div>
      </div>
      <div className="border-t px-6 py-4 flex-shrink-0" style={{ borderColor: P.line, background: P.cream }}>
        <div className="flex items-center gap-3 px-4 py-3 rounded-2xl border" style={{ background: P.paper, borderColor: P.line }}>
          <input value={inputVal}
            onChange={e => setInputVal(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleSend()}
            placeholder={T.chat.placeholder}
            className="flex-1 bg-transparent outline-none text-[14px]"
            style={{ color: P.ink, fontFamily: 'Manrope, sans-serif', caretColor: P.forest, outline: 'none', WebkitTextFillColor: P.ink, WebkitBoxShadow: '0 0 0px 1000px transparent inset', backgroundClip: 'text' }} />
          <button onClick={() => handleSend()}
            className="w-8 h-8 rounded-full flex items-center justify-center hover:opacity-70 flex-shrink-0 transition-all"
            style={{ background: 'transparent', border: `1px solid ${P.line}` }}>
            <ArrowUp size={14} color={P.muted} strokeWidth={2.5} />
          </button>
        </div>
      </div>
    </div>
  );
}

function ForecastTab({ approvedIds = [], capriStatus, ombrelloniStatus, actionStates = {}, onAction, demoPhase, factoringState, onFactoringApprove }) {
  const { T } = React.useContext(LangCtx);
  const anyApproved = approvedIds.length > 0;
  const [expandedId, setExpandedId] = useState(null);
  const [animating, setAnimating] = useState({});
  const [fadingPhase, setFadingPhase] = useState(false);
  const prevPhaseRef = React.useRef(demoPhase);

  // When demoPhase enters replies/later, fade cards out first
  useEffect(() => {
    const laterPhase = ['replies','reasoning','factoring-proposed','done'].includes(demoPhase);
    const wasEarlier = !['replies','reasoning','factoring-proposed','done'].includes(prevPhaseRef.current);
    if (laterPhase && wasEarlier) {
      setFadingPhase(true);
      setTimeout(() => setFadingPhase(false), 700);
    }
    prevPhaseRef.current = demoPhase;
  }, [demoPhase]); // { [id]: 'approved' | 'rejected' }

  const handleAction = (id, decision) => {
    setAnimating(prev => ({ ...prev, [id]: decision }));
    setExpandedId(null);
    setTimeout(() => {
      onAction(id, decision);
      setAnimating(prev => { const n = { ...prev }; delete n[id]; return n; });
    }, 1100);
  };
  const keyPoints = T.forecast.keypoints;
  return (
    <div className="p-5" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div>
        <div className="text-[11px] uppercase tracking-widest mb-1 flex items-center gap-2" style={{ color: P.muted }}>
          <Calendar size={11} color={P.muted} /> {T.forecast.title}
        </div>
        <div className="flex items-end gap-6 flex-wrap">
          <h2 className="font-display text-[28px] leading-[1.05]" style={{ color: P.ink, fontWeight: 400 }}>
            {T.forecast.headline}<br /><span style={{ fontStyle: "italic", color: P.forest }}>{T.forecast.headlineItalic}</span>
          </h2>
          <div className="flex gap-8 ml-auto">
            <Metric label={T.forecast.cashToday} value="€18,400" tone="neutral" />
            <Metric label={T.forecast.forecastLow} value="€12,900" tone={anyApproved ? "ok" : "risk"} sub={anyApproved ? T.forecast.withinFloor : T.forecast.onDay14} />
            <Metric label={T.forecast.forecastHigh} value="€44,600" tone="ok" sub={T.forecast.onDay85} />
          </div>
        </div>
      </div>

      {/* Chart */}
      <div className="rounded-2xl border p-3" style={{ background: P.paper, borderColor: P.line }}>
        <div className="flex items-center gap-3 mb-2 text-[11px]">
          {approvedIds.length > 0 && (
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-0.5 inline-block" style={{ background: P.forest }} />
              <span style={{ color: P.inkSoft }}>{T.forecast.withFlowra}</span>
            </div>
          )}
          <div className="flex items-center gap-1.5">
            <span className="w-3 inline-block border-t border-dashed" style={{ borderColor: P.muted, borderWidth: "1.5px" }} />
            <span style={{ color: P.muted }}>{T.forecast.noAction}</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="w-3 h-2 inline-block rounded-sm" style={{ background: P.terra, opacity: 0.25 }} />
            <span style={{ color: P.terra }}>{T.forecast.belowZero}</span>
          </div>
          <div className="flex items-center gap-1.5 ml-2">
            <span className="w-3 h-2 inline-block rounded-sm" style={{ background: P.mist, opacity: 0.5 }} />
            <span style={{ color: P.muted }}>{T.forecast.safeZone}</span>
          </div>
        </div>
        <ForecastChart data={BASE_FORECAST} approvedIds={approvedIds} />
      </div>

      {/* Suggested actions — below chart */}
      <div>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
          <div>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: P.muted, marginBottom: 2 }}>{T.forecast.suggestedActions}</div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 400, color: P.ink, lineHeight: 1.05 }}>
              {T.forecast.closeGap} <span style={{ fontStyle: 'italic', color: P.forest }}>{T.forecast.today}</span>
            </div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: P.muted, marginBottom: 2 }}>{T.forecast.combinedImpact}</div>
            <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 22, fontWeight: 500, color: P.forest }}>+€11,815</div>
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {T.forecast.actions.map(m => ({
            ...m,
            cpStatus: m.id === 'early-pay-capri' ? capriStatus : m.id === 'delay-ombrelloni' ? ombrelloniStatus : null,
          })).sort((a, b) => {
            const aActioned = actionStates[a.id] ? 1 : 0;
            const bActioned = actionStates[b.id] ? 1 : 0;
            return aActioned - bActioned;
          }).filter(m => {
            const isLaterPhase = ['replies','reasoning','factoring-proposed','done'].includes(demoPhase);
            if (isLaterPhase && !fadingPhase && actionStates[m.id]) return false;
            return true;
          }).map((m, idx) => {
            const catBg = { receivable: "#E8F0EA", payable: P.amberSoft, tax: P.lineSoft };
            const catFg = { receivable: P.forest, payable: P.amber, tax: P.inkSoft };
            const iconMap2 = { ArrowDownLeft, ArrowUpRight, FileText };
            const ActionIcon = iconMap2[m.iconName] || ArrowRight;
            const state = actionStates[m.id];
            const isExpanded = expandedId === m.id;

            let statusLabel = null, statusColor = P.muted;
            const sl = T.forecast.statusLabels;
            if (state === 'approved') {
              if (m.cpStatus === 'awaiting')    { statusLabel = sl.emailSent;        statusColor = P.amber; }
              else if (m.cpStatus === 'accepted' && m.id === 'early-pay-capri')  { statusLabel = sl.capriAccepted;    statusColor = P.forest; }
              else if (m.cpStatus === 'accepted' && m.id === 'delay-ombrelloni') { statusLabel = sl.ombrelloniAgreed; statusColor = P.forest; }
              else if (m.cpStatus === 'declined') { statusLabel = sl.declined;       statusColor = P.terra; }
              else if (m.id === 'vat-rateation')  { statusLabel = sl.vatFiled;       statusColor = P.forest; }
              else { statusLabel = sl.approvedSending; statusColor = P.forest; }
            } else if (state === 'rejected') { statusLabel = sl.skipped; statusColor = P.muted; }

            const isFadingOut = fadingPhase && actionStates[m.id];
            const anim = animating[m.id];
            const isAwaiting = state === 'approved' && m.cpStatus === 'awaiting';
            const isDoneApproved = state === 'approved' && !anim;
            const isDoneRejected = state === 'rejected' && !anim;
            const animStyle = isFadingOut
              ? { animation: 'cardFadeOut 0.6s ease forwards', pointerEvents: 'none' }
              : anim === 'approved'
              ? { animation: 'cardApprove 1.1s cubic-bezier(0.16,1,0.3,1) forwards' }
              : anim === 'rejected'
              ? { animation: 'cardReject 0.9s cubic-bezier(0.16,1,0.3,1) forwards' }
              : state ? { animation: 'cardSettleDown 0.65s cubic-bezier(0.16,1,0.3,1) forwards' } : {};

            return (
              <div key={m.id} style={{
                borderRadius: 14,
                border: `1px solid ${
                  anim === 'approved' ? P.forest :
                  isDoneApproved && m.cpStatus === 'accepted' ? P.forest :
                  isDoneApproved ? 'rgba(79,158,120,0.4)' :
                  isAwaiting ? P.amber :
                  isDoneRejected ? P.lineSoft :
                  P.line}`,
                overflow: 'hidden',
                opacity: isDoneRejected ? 0.3 : 1,
                position: 'relative',
                background: isDoneApproved ? 'rgba(79,158,120,0.04)' : P.paper,
                transition: 'opacity 0.6s ease, border-color 0.5s ease, background 0.5s ease',
                ...(isAwaiting ? { animation: 'awaitingPulse 2.4s ease-in-out infinite' } : animStyle),
              }}>
                {/* Green left accent on approved-settled cards */}
                {isDoneApproved && !anim && (
                  <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: 4, background: P.forest, borderRadius: '14px 0 0 14px', opacity: 0.7 }} />
                )}
                {/* Approve flood overlay */}
                {anim === 'approved' && (
                  <div style={{
                    position: 'absolute', inset: 0, zIndex: 2, borderRadius: 14,
                    background: 'rgba(79,158,120,0.18)',
                    animation: 'cardApproveFlood 1.1s ease forwards',
                    pointerEvents: 'none',
                  }} />
                )}
                {/* Awaiting scan line */}
                {isAwaiting && (
                  <div style={{
                    position: 'absolute', inset: 0, zIndex: 1, overflow: 'hidden', borderRadius: 14, pointerEvents: 'none',
                  }}>
                    <div style={{
                      position: 'absolute', top: 0, bottom: 0, width: '35%',
                      background: 'linear-gradient(90deg, transparent 0%, rgba(200,150,50,0.1) 50%, transparent 100%)',
                      animation: 'awaitingScan 2.2s ease-in-out infinite',
                    }} />
                  </div>
                )}
                {/* Action badge */}
                {anim && (
                  <div style={{
                    position: 'absolute', right: 20, top: '50%', transform: 'translateY(-50%)',
                    zIndex: 10, pointerEvents: 'none',
                    width: 52, height: 52, borderRadius: '50%',
                    background: anim === 'approved' ? P.forest : '#999',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    boxShadow: anim === 'approved' ? '0 4px 20px rgba(79,158,120,0.45)' : '0 2px 10px rgba(0,0,0,0.15)',
                    animation: anim === 'approved' ? 'cardApproveBadge 1.1s cubic-bezier(0.16,1,0.3,1) forwards' : 'cardRejectBadge 0.9s cubic-bezier(0.16,1,0.3,1) forwards',
                  }}>
                    {anim === 'approved'
                      ? <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                      : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    }
                  </div>
                )}
                {/* Header row */}
                <div style={{ padding: '12px 16px', paddingLeft: isDoneApproved ? 20 : 16, background: 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12 }}
                  onClick={() => setExpandedId(isExpanded ? null : m.id)}>
                  {/* Number */}
                  <div style={{ fontSize: 11, fontFamily: 'JetBrains Mono, monospace', color: P.muted, flexShrink: 0, width: 20 }}>{m.num}</div>
                  {/* Icon */}
                  <div style={{ width: 32, height: 32, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: catBg[m.category], flexShrink: 0 }}>
                    <ActionIcon size={13} color={catFg[m.category]} strokeWidth={2} />
                  </div>
                  {/* Title block */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 13, fontWeight: 600, color: P.ink, lineHeight: 1.25, textDecoration: isDoneRejected ? 'line-through' : 'none', opacity: isDoneRejected ? 0.5 : 1 }}>{m.title}</p>
                    <p style={{ fontSize: 11, color: statusLabel ? statusColor : P.muted, marginTop: 2, fontStyle: statusLabel ? 'italic' : 'normal' }}>
                      {statusLabel || m.subtitle}
                    </p>
                  </div>
                  {/* Impact */}
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 15, fontWeight: 600, color: state === 'rejected' ? P.muted : P.forest, lineHeight: 1, display: 'flex', alignItems: 'center', gap: 4, justifyContent: 'flex-end' }}>
                      {isDoneApproved && !anim && <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={P.forest} strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
                      {m.impact}
                    </div>
                    <div style={{ fontSize: 10, color: P.muted, marginTop: 3 }}>{m.timing}</div>
                  </div>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={P.muted} strokeWidth="2.5"
                    style={{ flexShrink: 0, transform: isExpanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}>
                    <polyline points="6 9 12 15 18 9"/>
                  </svg>
                </div>
                {/* Expanded */}
                {isExpanded && (
                  <div style={{ padding: '11px 15px 13px', background: P.cream, borderTop: `1px solid ${P.lineSoft}` }}>
                    <p style={{ fontSize: 13, color: P.inkSoft, lineHeight: 1.6, marginBottom: 12 }}>{m.detail}</p>
                    {!state ? (
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button onClick={() => handleAction(m.id, 'approved')}
                          style={{ padding: '9px 28px', borderRadius: 999, background: P.ink, color: 'white', fontSize: 13, fontWeight: 600, border: 'none', cursor: 'pointer', letterSpacing: '0.01em' }}>
                          {T.forecast.approve}
                        </button>
                        <button onClick={() => handleAction(m.id, 'rejected')}
                          style={{ padding: '9px 20px', borderRadius: 999, border: `1px solid ${P.line}`, color: P.inkSoft, fontSize: 13, background: 'transparent', cursor: 'pointer' }}>
                          {T.forecast.skip}
                        </button>
                      </div>
                    ) : (
                      <div style={{ fontSize: 12, color: statusColor, fontStyle: 'italic' }}>{statusLabel}</div>
                    )}
                  </div>
                )}
              </div>
            );
          })}

          {/* Triver factoring card */}
          {['factoring-proposed','done'].includes(demoPhase) && (() => {
            const fState = factoringState;
            const isExpanded = expandedId === 'triver-factor';
            return (
              <div style={{
                borderRadius: 14, overflow: 'hidden',
                border: `1.5px solid ${fState === 'done' ? P.forest : fState ? P.amber : P.forest}`,
                boxShadow: !fState ? `0 0 0 3px ${P.mist}` : 'none',
              }}>
                <div style={{ padding: '16px 18px', background: fState === 'done' ? '#F0F6F2' : P.paper, cursor: fState ? 'default' : 'pointer', display: 'flex', alignItems: 'center', gap: 14 }}
                  onClick={() => !fState && setExpandedId(isExpanded ? null : 'triver-factor')}>
                  <div style={{ fontSize: 11, fontFamily: 'JetBrains Mono, monospace', color: P.muted, flexShrink: 0, width: 20 }}>04</div>
                  <div style={{ width: 32, height: 32, borderRadius: '50%', background: P.mist, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={P.forest} strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 14, fontWeight: 600, color: P.ink, lineHeight: 1.25 }}>{T.forecast.factoring.title}</p>
                    <p style={{ fontSize: 12, color: fState === 'done' ? P.forest : fState ? P.amber : P.forest, marginTop: 3, fontStyle: fState ? 'italic' : 'normal', fontWeight: fState ? 400 : 500 }}>
                      {fState === 'done' ? T.forecast.factoring.funded : fState ? T.forecast.factoring.processing : T.forecast.factoring.recommended}
                    </p>
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 18, fontWeight: 600, color: P.forest, lineHeight: 1 }}>+€17,020</div>
                    <div style={{ fontSize: 10, color: P.muted, marginTop: 3 }}>{T.forecast.factoring.feeInfo}</div>
                  </div>
                  {!fState && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={P.muted} strokeWidth="2.5"
                    style={{ flexShrink: 0, transform: isExpanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}><polyline points="6 9 12 15 18 9"/></svg>}
                </div>
                {isExpanded && !fState && (
                  <div style={{ padding: '14px 18px 18px', background: P.cream, borderTop: `1px solid ${P.lineSoft}` }}>
                    <p style={{ fontSize: 13, color: P.inkSoft, lineHeight: 1.65, marginBottom: 16 }}>
                      {T.forecast.factoring.detail.split('\n').map((line, i) => <React.Fragment key={i}>{line}{i < T.forecast.factoring.detail.split('\n').length - 1 && <br/>}</React.Fragment>)}
                    </p>
                    <button onClick={() => { onFactoringApprove(); setExpandedId(null); }}
                      style={{ width: '100%', padding: '10px 0', borderRadius: 999, background: P.forest, color: 'white', fontSize: 13, fontWeight: 600, border: 'none', cursor: 'pointer' }}>
                      {T.forecast.factoring.approveCta}
                    </button>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

/* ---- Actions Tab ---- */

  const fade = (delay = 0) => ({

    transform: vis ? 'none' : 'translateY(10px)',
    transition: `all 0.5s cubic-bezier(0.16,1,0.3,1) ${delay}ms`,
  });

  return (
    <div className="p-7">

      {/* Welcome header */}
      <div className="mb-7" style={fade(0)}>
        <p className="text-[12px] uppercase tracking-widest mb-1" style={{ color: P.muted }}>Bagni Aurora · Apr 24</p>
        <h2 className="font-display" style={{ fontSize: 34, fontWeight: 400, color: P.ink, lineHeight: 1.1 }}>
          Buongiorno,<br /><span style={{ fontStyle: 'italic' }}>30 days to season.</span>
        </h2>
      </div>

      {/* Hero alert card */}
      <div className="rounded-2xl p-5 mb-4 flex items-start justify-between gap-4" style={{ background: P.paper, border: `1px solid ${P.line}`, ...fade(80) }}>
        <div className="flex-1">
          <div className="flex items-center gap-2 mb-2">
            <div className="w-2 h-2 rounded-full pulse-dot" style={{ background: P.terra }} />
            <span className="text-[11px] uppercase tracking-widest font-medium" style={{ color: P.terra }}>Cash gap detected</span>
          </div>
          <p className="text-[14px] leading-relaxed mb-4" style={{ color: P.inkSoft }}>
            Your balance hits <strong style={{ color: P.terra }}>€12,900</strong> on day 14 — below your €15k floor. Three fixes close the gap entirely.
          </p>
          <button onClick={() => onSwitchTab("actions")}
            className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-white font-medium hover:opacity-90 transition-all text-[13px]"
            style={{ background: P.ink, boxShadow: "0 6px 20px -8px rgba(20,32,26,0.5)" }}>
            Review the 3 fixes
            <ArrowRight size={13} color="white" strokeWidth={2} />
          </button>
        </div>
        <div className="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center" style={{ background: P.terraSoft }}>
          <Sparkles size={16} color={P.terra} strokeWidth={2} />
        </div>
      </div>

      {/* 2-col stats grid */}
      <div className="grid grid-cols-2 gap-3 mb-4" style={fade(160)}>
        <div className="rounded-2xl p-5 border" style={{ background: P.paper, borderColor: P.line }}>
          <p className="text-[11px] uppercase tracking-widest mb-1" style={{ color: P.muted }}>Liquidity trapped</p>
          <p className="text-[11px] mb-3 leading-snug" style={{ color: P.inkSoft }}>DSO/DPO mismatch</p>
          <div className="font-mono font-medium mb-3" style={{ fontSize: 28, color: P.amber, lineHeight: 1 }}>€7,200</div>
          <button onClick={() => onSwitchTab("terms")} className="text-[12px] font-medium flex items-center gap-1 hover:opacity-70 transition-all" style={{ color: P.ink }}>
            Review terms <ArrowRight size={11} strokeWidth={2} />
          </button>
        </div>
        <div className="rounded-2xl p-5 border" style={{ background: P.paper, borderColor: P.line }}>
          <p className="text-[11px] uppercase tracking-widest mb-1" style={{ color: P.muted }}>Impact ready</p>
          <p className="text-[11px] mb-3 leading-snug" style={{ color: P.inkSoft }}>3 actions · 1 approval each</p>
          <div className="font-mono font-medium mb-3" style={{ fontSize: 28, color: P.forest, lineHeight: 1 }}>+€11,815</div>
          <button onClick={() => onSwitchTab("forecast")} className="text-[12px] font-medium flex items-center gap-1 hover:opacity-70 transition-all" style={{ color: P.ink }}>
            View forecast <ArrowRight size={11} strokeWidth={2} />
          </button>
        </div>
      </div>

      {/* Horizon status */}
      <div className="rounded-2xl p-5 border" style={{ background: P.paper, borderColor: P.line, ...fade(240) }}>
        <p className="text-[11px] uppercase tracking-widest mb-3" style={{ color: P.muted }}>90-day horizon · read today</p>
        <div className="flex items-center gap-6">
          {[
            { label: "Invoices read", val: "87" },
            { label: "Counterparties", val: "47" },
            { label: "Recurring items", val: "3" },
          ].map(({ label, val }) => (
            <div key={label}>
              <div className="font-mono font-medium text-[20px]" style={{ color: P.ink }}>{val}</div>
              <div className="text-[11px]" style={{ color: P.muted }}>{label}</div>
            </div>
          ))}
        </div>
      </div>

    </div>
  );
}

/* ---- Workspace Panel ---- */
function WorkspacePanel({ tab, setTab, chartApprovedIds = [], capriStatus, ombrelloniStatus, actionStates = {}, onAction, demoPhase, factoringState, onFactoringApprove }) {
  const { T } = React.useContext(LangCtx);
  const tabs = [
    { id: "forecast", label: T.workspace.tabs.forecast, Icon: TrendingUp },
    { id: "terms", label: T.workspace.tabs.terms, Icon: Clock },
    { id: "credit", label: T.workspace.tabs.credit, Icon: Landmark, highlight: true },
  ];
  return (
    <div className="flex flex-col h-full" style={{ background: P.cream }}>
      <div className="flex items-center px-6 pt-5 pb-3 border-b" style={{ borderColor: P.line }}>
        <div className="flex gap-1">
          {tabs.map(({ id, label, Icon, badge, highlight }) => {
            const active = tab === id;
            return (
              <button key={id} onClick={() => setTab(id)}
                className="relative px-3.5 py-2 rounded-full text-[13px] font-medium flex items-center gap-1.5"
                style={{ background: active ? P.paper : "transparent", color: active ? P.ink : P.muted, border: `1px solid ${active ? P.line : "transparent"}` }}>
                <Icon size={13} color={active ? P.ink : P.muted} />
                {label}
                {badge > 0 && (
                  <span className="ml-1 text-[10px] font-mono px-1.5 py-0.5 rounded-full"
                    style={{ background: active ? P.ink : P.lineSoft, color: active ? "white" : P.inkSoft }}>{badge}</span>
                )}
                {highlight && !active && (
                  <span className="absolute w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: P.leaf, top: -2, right: -2 }} />
                )}
              </button>
            );
          })}
        </div>
        <div className="ml-auto flex items-center gap-2 text-[11px] uppercase tracking-widest" style={{ color: P.muted }}>
          <Shield size={11} color={P.muted} /> {T.workspace.reviewMode}
        </div>
      </div>
      <div className="flex-1 overflow-y-auto subtle-scrollbar">
        {tab === "forecast" && <ForecastTab approvedIds={chartApprovedIds} capriStatus={capriStatus} ombrelloniStatus={ombrelloniStatus} actionStates={actionStates} onAction={onAction} demoPhase={demoPhase} factoringState={factoringState} onFactoringApprove={onFactoringApprove} />}
        {tab === "terms" && <TermsTab />}
        {tab === "credit" && <CreditTab />}
      </div>
    </div>
  );
}

/* ---- App Root ---- */
function App({ splitW: initialSplitW = "25%" }) {
  const { T } = React.useContext(LangCtx);
  const [stage, setStage] = useState("landing");
  const [tab, setTab] = useState("forecast");
  const [chatWidth, setChatWidth] = useState(initialSplitW);
  const dragging = React.useRef(false);
  const containerRef = React.useRef(null);

  const startDrag = (e) => {
    dragging.current = true;
    e.preventDefault();
    const onMove = (ev) => {
      if (!dragging.current || !containerRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      const pct = Math.min(50, Math.max(15, ((ev.clientX - rect.left) / rect.width) * 100));
      setChatWidth(pct + '%');
    };
    const onUp = () => { dragging.current = false; window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  // Demo narrative state
  const [demoPhase, setDemoPhase] = useState("opening");
  const [capriStatus, setCapriStatus] = useState(null);
  const [ombrelloniStatus, setOmbrelloniStatus] = useState(null);
  const [vatApplied, setVatApplied] = useState(false);
  const [factoringState, setFactoringState] = useState(null);
  const [triverDone, setTriverDone] = useState(false);
  const [actionStates, setActionStates] = useState({});

  const handleAction = (id, decision) => {
    setActionStates(prev => ({ ...prev, [id]: decision }));
    if (decision === 'approved') {
      if (id === 'early-pay-capri')  setCapriStatus('awaiting');
      if (id === 'delay-ombrelloni') setOmbrelloniStatus('awaiting');
      if (id === 'vat-rateation')    setVatApplied(true);
    }
  };

  const allActioned = ['early-pay-capri', 'delay-ombrelloni', 'vat-rateation'].every(id => actionStates[id]);
  const showSkip = allActioned && (capriStatus === 'awaiting' || ombrelloniStatus === 'awaiting')
    && !['replies','reasoning','factoring-proposed','done'].includes(demoPhase);

  const chartApprovedIds = [
    ...(vatApplied ? ['vat-rateation'] : []),
    ...(capriStatus === 'accepted' ? ['early-pay-capri'] : []),
    ...(ombrelloniStatus === 'accepted' ? ['delay-ombrelloni'] : []),
    ...(triverDone ? ['triver-factor'] : []),
  ];

  const roiUnlocked = chartApprovedIds.reduce((sum, id) => {
    const l = ACTION_LIFTS[id]; return sum + (l ? l.amount : 0);
  }, 0);

  return (
    <div className="w-full h-screen flex flex-col" style={{ background: P.cream, color: P.ink, fontFamily: "Manrope, sans-serif", position: 'relative' }}>
      {stage === "landing" && <Landing onConnect={() => setStage("connecting")} />}
      {stage === "connecting" && <Connecting onDone={() => setStage("dashboard")} />}
      {stage === "dashboard" && (
        <>
          <Header roiUnlocked={roiUnlocked} />
          <div ref={containerRef} className="flex flex-1 overflow-hidden" style={{ position: 'relative' }}>
            <div className="border-r flex flex-col" style={{ width: chatWidth, minWidth: '15%', maxWidth: '50%', flexShrink: 0, borderColor: P.line }}>
              <ChatPanel
                demoPhase={demoPhase} setDemoPhase={setDemoPhase}
                capriStatus={capriStatus} setCapriStatus={setCapriStatus}
                ombrelloniStatus={ombrelloniStatus} setOmbrelloniStatus={setOmbrelloniStatus}
                vatApplied={vatApplied}
                factoringState={factoringState} setFactoringState={setFactoringState}
                triverDone={triverDone} setTriverDone={setTriverDone}
                onSwitchTab={setTab}
              />
            </div>
            <div style={{ width: 1, flexShrink: 0, background: P.line }} />
            <div className="flex-1 flex flex-col overflow-hidden">
              <WorkspacePanel tab={tab} setTab={setTab} chartApprovedIds={chartApprovedIds}
                capriStatus={capriStatus} ombrelloniStatus={ombrelloniStatus}
                actionStates={actionStates} onAction={handleAction}
                demoPhase={demoPhase} factoringState={factoringState}
                onFactoringApprove={() => setFactoringState('approved')} />
            </div>
            {showSkip && (
              <div style={{ position: 'absolute', bottom: 28, left: '50%', transform: 'translateX(-50%)', zIndex: 40, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, pointerEvents: 'none' }}>
                <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.12em', color: P.muted, background: P.cream, padding: '2px 10px', borderRadius: 999, border: `1px solid ${P.line}`, pointerEvents: 'auto' }}>{T.app.demoLabel}</div>
                <button onClick={() => setDemoPhase('replies')} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 24px', borderRadius: 999, background: P.ink, color: 'white', fontSize: 13, fontWeight: 500, border: 'none', cursor: 'pointer', boxShadow: '0 6px 24px -6px rgba(20,32,26,0.5)', pointerEvents: 'auto' }}>
                  {T.app.skip48h}
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
                </button>
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ---- Tweaks wrapper ---- */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "skin": "riviera",
  "split": "balanced"
}/*EDITMODE-END*/;

function TweakedApp() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [renderKey, setRenderKey] = React.useState(0);
  const prevSkin = React.useRef(null);

  React.useEffect(() => {
    const skin = tweaks.skin || 'riviera';
    if (skin !== prevSkin.current) {
      Object.assign(P, PALETTES[skin] || PALETTES.riviera);
      prevSkin.current = skin;
      setRenderKey(k => k + 1);
    }
  }, [tweaks.skin]);

  React.useEffect(() => {
    Object.assign(P, PALETTES[tweaks.skin || 'riviera'] || PALETTES.riviera);
    prevSkin.current = tweaks.skin || 'riviera';
    setRenderKey(k => k + 1);
  }, []);

  const splitW = "25%"; // controlled by drag handle

  return (
    <>
      <App key={renderKey} splitW="25%" />
      <TweaksPanel>
        <TweakSection title="Skin">
          <div style={{ display: 'flex', gap: 8 }}>
            {Object.keys(PALETTES).map(s => (
              <button key={s} onClick={() => setTweak('skin', s)}
                style={{
                  flex: 1, padding: '10px 0', borderRadius: 10, fontSize: 12, fontWeight: 500, cursor: 'pointer',
                  border: `1.5px solid ${tweaks.skin === s ? PALETTES[s].forest : PALETTES[s].line}`,
                  background: PALETTES[s].cream, color: PALETTES[s].ink,
                  outline: tweaks.skin === s ? `2px solid ${PALETTES[s].forest}` : 'none',
                  outlineOffset: 2,
                }}>
                {s.charAt(0).toUpperCase() + s.slice(1)}
              </button>
            ))}
          </div>
        </TweakSection>
        <TweakSection title="Layout">
          <TweakRadio id="split" value={tweaks.split} onChange={v => setTweak('split', v)}
            options={[
              { value: 'chat', label: 'Chat-first' },
              { value: 'balanced', label: 'Balanced' },
              { value: 'dashboard', label: 'Dashboard-first' },
            ]} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LangProvider><TweakedApp /></LangProvider>);
</script>
</body>
</html>
